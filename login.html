<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLIPER - Login</title>

  <!-- Fontes (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

  <!-- CSS -->
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- menu e cabeçalho -->
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">

        <a class="navbar-brand logo" href="index.html">FLIPER</a>

        <div class="icones order-lg-3">
          <a href="login.html" class="ativo" aria-label="Entrar na minha conta" title="Entrar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
            </svg>
          </a>
          <a href="index.html" aria-label="Voltar para a loja" title="Carrinho">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L22 7H6"></path>
              <circle cx="10" cy="20.5" r="1.5"></circle>
              <circle cx="18" cy="20.5" r="1.5"></circle>
            </svg>
          </a>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
          aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse order-lg-2" id="menuPrincipal">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html#section-banner">PC Gamer</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#section-produtos">Lançamentos</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#section-produtos">Periféricos</a></li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <main>

    <!-- formulário de login -->
    <section id="section-login">
      <h1>Login</h1>

      <div class="mb-3">
        <label for="usuario" class="form-label">Nome:</label>
        <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Insira o seu usuário">
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha:</label>
        <input type="password" id="senha" class="form-control" placeholder="Insira a sua senha">
      </div>

      <input type="button" value="login" class="btn btn-fliper" id="bt-login" onclick="login()">

      <div id="botao-cadastrar">
        <button type="button">Não é cadastrado ainda? Cadastre-se</button>
      </div>

      <p class="text-center text-muted small mt-4">Acesso de teste: usuário <strong>admin</strong> e senha <strong>123456</strong></p>
    </section>

    <!-- Formulário de cadastro -->
    <section id="section-cadastro">
      <div id="form-cadastrar">
        <h2>Criar minha conta</h2>
        <p>Informe os seus dados abaixo para criar sua conta.</p>

        <div class="mb-3">
          <label for="novo-usuario" class="form-label">Usuário:</label>
          <input type="text" id="novo-usuario" class="form-control" placeholder="ex. nome de usuário">
        </div>

        <div class="mb-3">
          <label for="novo-email" class="form-label">E-mail:</label>
          <input type="email" id="novo-email" class="form-control" placeholder="seu@email.com.br">
        </div>

        <div class="mb-3">
          <label for="nova-senha" class="form-label">Senha:</label>
          <input type="password" id="nova-senha" class="form-control" placeholder="mínimo de 6 caracteres">
        </div>

        <input type="button" value="Cadastrar" class="btn btn-fliper" id="bt-cadastrar" onclick="cadastro()">

        <div class="text-center mt-3">
          <button type="button" id="voltar-login">Já tenho conta. Voltar ao login</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Rodapé -->
  <footer>
    <div class="contato">
      <p>
        <a href="https://www.instagram.com/flipergamingstore" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
          </svg>flipergamingstore
        </a>
      </p>
      <p><a href="tel:+5561999999999">(61) 9 9999-9999</a></p>
      <p>Contato: <a href="mailto:fliper@fliper.com">fliper@fliper.com</a></p>
    </div>

    <div class="marca">
      <p class="logo-rodape">FLIPER</p>
      <p class="slogan">Gaming 4 gamers</p>
      <p class="direitos">Todos os direitos reservados</p>
    </div>
  </footer>

  <button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">&uarr; Voltar ao topo</button>

  <!-- Scripts JS e jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
    crossorigin="anonymous"></script>
  <script src="js/script.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.1.js"
    integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>
  <script src="js/jquery-script.js"></script>

</body>
</html>
