<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLIPER - Gaming 4 gamers</title>

  <!-- Fontes (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

  <!-- CSS local -->
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- ================= CABEÇALHO / MENU ================= -->
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">

        <a class="navbar-brand logo" href="index.html">FLIPER</a>

        <!-- Ícones: usuário (login) e carrinho -->
        <div class="icones order-lg-3">
          <a href="login.html" aria-label="Entrar na minha conta" title="Entrar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
            </svg>
          </a>
          <button type="button" onclick="verCarrinho()" aria-label="Ver carrinho" title="Carrinho">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L22 7H6"></path>
              <circle cx="10" cy="20.5" r="1.5"></circle>
              <circle cx="18" cy="20.5" r="1.5"></circle>
            </svg>
            <span id="contador-carrinho" hidden>0</span>
          </button>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
          aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse order-lg-2" id="menuPrincipal">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#section-banner">PC Gamer</a></li>
            <li class="nav-item"><a class="nav-link" href="#section-produtos">Lançamentos</a></li>
            <li class="nav-item"><a class="nav-link" href="#section-produtos">Periféricos</a></li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <main>

    <!-- ================= BANNER (destaque) ================= -->
    <section id="section-banner" aria-label="Destaque: monte seu PC custom">
      <div class="banner">
        <div class="banner-texto">
          <h2 class="chamada">Monte seu</h2>
          <p class="destaque">Custom</p>
          <p class="preco-inicial">À partir de R$ 2.000</p>
        </div>
        <div class="banner-imagem">
          <img src="img/banner-pc.jpg" alt="Gabinete gamer com fans iluminados em azul">
        </div>
      </div>
    </section>

    <!-- ================= PRODUTOS (galeria) ================= -->
    <section id="section-produtos" aria-label="Produtos em destaque">
      <div class="row">

        <div class="col-12 col-md-6 col-lg-4">
          <article class="produto">
            <figure>
              <div class="foto">
                <img src="img/teclado.jpg" alt="Teclado mecânico com iluminação RGB">
                <button type="button" class="btn btn-adicionar" onclick="adicionarAoCarrinho('Teclado ABC v1.0')">Adicionar ao carrinho</button>
              </div>
              <figcaption>
                <span class="nome">Teclado ABC v1.0</span>
                <del class="de">De: R$ 349,90</del>
                <span class="por">POR: R$ 279,90</span>
              </figcaption>
            </figure>
          </article>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <article class="produto">
            <figure>
              <div class="foto">
                <img src="img/mouse.jpg" alt="Mouse gamer com iluminação roxa">
                <button type="button" class="btn btn-adicionar" onclick="adicionarAoCarrinho('Mouse X - Model 1')">Adicionar ao carrinho</button>
              </div>
              <figcaption>
                <span class="nome">Mouse X - Model 1</span>
                <del class="de">De: R$ 199,90</del>
                <span class="por">POR: R$ 149,90</span>
              </figcaption>
            </figure>
          </article>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <article class="produto">
            <figure>
              <div class="foto">
                <img src="img/monitor.jpg" alt="Setup gamer com dois monitores">
                <button type="button" class="btn btn-adicionar" onclick="adicionarAoCarrinho('Monitor YZ - 220v')">Adicionar ao carrinho</button>
              </div>
              <figcaption>
                <span class="nome">Monitor YZ - 220v</span>
                <del class="de">De: R$ 1.299,00</del>
                <span class="por">POR: R$ 999,00</span>
              </figcaption>
            </figure>
          </article>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <article class="produto">
            <figure>
              <div class="foto">
                <img src="img/processador.jpg" alt="Processador Ryzen instalado na placa-mãe">
                <button type="button" class="btn btn-adicionar" onclick="adicionarAoCarrinho('Processador Ryzen')">Adicionar ao carrinho</button>
              </div>
              <figcaption>
                <span class="nome">Processador Ryzen</span>
                <del class="de">De: R$ 1.599,00</del>
                <span class="por">POR: R$ 1.299,00</span>
              </figcaption>
            </figure>
          </article>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <article class="produto">
            <figure>
              <div class="foto">
                <img src="img/gpu.jpg" alt="Placas de vídeo RTX">
                <button type="button" class="btn btn-adicionar" onclick="adicionarAoCarrinho('GPU RTX 1234')">Adicionar ao carrinho</button>
              </div>
              <figcaption>
                <span class="nome">GPU RTX 1234</span>
                <del class="de">De: R$ 3.999,00</del>
                <span class="por">POR: R$ 3.499,00</span>
              </figcaption>
            </figure>
          </article>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <article class="produto">
            <figure>
              <div class="foto">
                <img src="img/joystick.jpg" alt="Controle de videogame com luz vermelha">
                <button type="button" class="btn btn-adicionar" onclick="adicionarAoCarrinho('Joystick Loren Ipsum')">Adicionar ao carrinho</button>
              </div>
              <figcaption>
                <span class="nome">Joystick Loren Ipsum</span>
                <del class="de">De: R$ 299,90</del>
                <span class="por">POR: R$ 229,90</span>
              </figcaption>
            </figure>
          </article>
        </div>

      </div>
    </section>

  </main>

  <!-- ================= RODAPÉ ================= -->
  <footer>
    <div class="contato">
      <p>
        <a href="https://www.instagram.com/flipergamingstore" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
          </svg>flipergamingstore
        </a>
      </p>
      <p><a href="tel:+5561999999999">(61) 9 9999-9999</a></p>
      <p>Contato: <a href="mailto:fliper@fliper.com">fliper@fliper.com</a></p>
    </div>

    <div class="marca">
      <p class="logo-rodape">FLIPER</p>
      <p class="slogan">Gaming 4 gamers</p>
      <p class="direitos">Todos os direitos reservados</p>
    </div>
  </footer>

  <!-- Botão voltar ao topo (aparece depois de rolar a página) -->
  <button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">&uarr; Voltar ao topo</button>

  <!-- Aviso (toast) de produto adicionado -->
  <div class="toast-container position-fixed bottom-0 start-0 p-3">
    <div id="aviso-carrinho" class="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-body" id="aviso-texto"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
    crossorigin="anonymous"></script>
  <script src="js/script.js"></script>

</body>
</html>
